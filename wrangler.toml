name = "pebble-bridge-worker"
main = "src/index.js"
compatibility_date = "2026-08-08"

# Non-secret config. Secrets (OPENROUTER_API_KEY, GITHUB_TOKEN,
# GITHUB_WEBHOOK_SECRET) are set with `wrangler secret put`, never here.
[vars]
REPO_OWNER = "ksudana"
REPO_NAME = "PebbleBridge"
BRANCH = "main"
OPENROUTER_MODEL = "openrouter/free"
# Web search via OpenRouter's "web" plugin routed to Firecrawl (BYOK, free tier).
# Set to "0" to disable web search and stop spending Firecrawl credits.
WEB_SEARCH_MAX_RESULTS = "5"
